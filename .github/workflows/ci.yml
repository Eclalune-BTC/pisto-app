name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pisto
          POSTGRES_PASSWORD: pisto_ci
          POSTGRES_DB: pisto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pisto -d pisto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pisto:pisto_ci@localhost:5432/pisto
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      APP_URL: http://localhost:8081
      EXPO_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node for Expo tooling
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source and tests
        run: bun run check

      - name: Apply and exercise PostgreSQL migrations
        run: |
          bun run db:migrate
          bun run --filter @pisto/db test:integration

      - name: Reject new dependency advisories
        run: bun run audit:ci

      - name: Validate schema contracts and release safeguards
        run: |
          bun run db:check
          bun run auth:schema:check
          python3 -m unittest discover -s infra/gcp -p 'test_*.py'
          bash -n infra/gcp/release.sh

      - name: Build the portable API image
        run: docker build --pull -t pisto-api:ci -f apps/api/Dockerfile .

      - name: Exercise bundled migrations and the container contract
        run: |
          docker run --rm --network host --env DATABASE_URL \
            --entrypoint bun pisto-api:ci packages/db/dist/bundled-migrate.js
          docker run -d --name pisto-api-ci --network host \
            --env DATABASE_URL --env BETTER_AUTH_SECRET \
            --env NODE_ENV=production --env PORT=3301 \
            --env BETTER_AUTH_URL=https://api.pisto.app \
            --env BILLING_ENABLED=false --env REVENUECAT_ENABLED=false \
            pisto-api:ci
          trap 'docker logs pisto-api-ci; docker stop --time 10 pisto-api-ci' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 \
            http://localhost:3301/ready
          curl --fail --max-time 5 http://localhost:3301/health
          test "$(curl --silent --output /tmp/pisto-denied.json --write-out '%{http_code}' \
            --max-time 5 http://localhost:3301/v1/me)" = 401
          docker stop --time 10 pisto-api-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' pisto-api-ci)" = 0
