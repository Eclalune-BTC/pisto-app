name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pisto
          POSTGRES_PASSWORD: pisto_ci
          POSTGRES_DB: pisto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pisto -d pisto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pisto:pisto_ci@localhost:5432/pisto
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      APP_URL: http://localhost:8081
      EXPO_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node for Expo tooling
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source and tests
        run: bun run check

      - name: Reject new dependency advisories
        run: bun run audit:ci

      - name: Build packages and applications
        run: bun run build
