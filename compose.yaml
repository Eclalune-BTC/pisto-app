name: pisto-stack

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pisto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pisto_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-pisto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pisto} -d ${POSTGRES_DB:-pisto}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pisto_postgres_data:/var/lib/postgresql

volumes:
  pisto_postgres_data:
