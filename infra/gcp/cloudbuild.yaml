substitutions:
  _REGION: us-central1
  _REPOSITORY: pisto
  _SERVICE: pisto-api
  _SERVICE_ACCOUNT: pisto-api
  _MIGRATION_JOB: pisto-migrate
  _MIGRATION_SERVICE_ACCOUNT: pisto-migrate
  _API_URL: ""
  _APP_URL: ""
  _APP_SCHEME: pisto
  _DATABASE_SECRET_VERSION: ""
  _MIGRATION_SECRET_VERSION: ""
  _AUTH_SECRET_VERSION: ""
  _PRODUCT_WRITES_ENABLED: "true"
  _PRODUCT_READ_LIMIT_PER_MINUTE: "300"
  _PRODUCT_WRITE_LIMIT_PER_MINUTE: "60"

steps:
  - id: validate-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: [infra/gcp/validate.py]
    env:
      - PISTO_BUILD_ID=$BUILD_ID
      - PISTO_MIGRATION_JOB=${_MIGRATION_JOB}
      - PISTO_API_URL=${_API_URL}
      - PISTO_APP_URL=${_APP_URL}
      - PISTO_APP_SCHEME=${_APP_SCHEME}
      - PISTO_DATABASE_SECRET_VERSION=${_DATABASE_SECRET_VERSION}
      - PISTO_MIGRATION_SECRET_VERSION=${_MIGRATION_SECRET_VERSION}
      - PISTO_AUTH_SECRET_VERSION=${_AUTH_SECRET_VERSION}
      - PISTO_PRODUCT_WRITES_ENABLED=${_PRODUCT_WRITES_ENABLED}
      - PISTO_PRODUCT_READ_LIMIT_PER_MINUTE=${_PRODUCT_READ_LIMIT_PER_MINUTE}
      - PISTO_PRODUCT_WRITE_LIMIT_PER_MINUTE=${_PRODUCT_WRITE_LIMIT_PER_MINUTE}

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --file=apps/api/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:build-$BUILD_ID
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:build-$BUILD_ID

  - id: migrate-and-deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: [infra/gcp/release.sh]
    env:
      - PISTO_PROJECT=$PROJECT_ID
      - PISTO_BUILD_ID=$BUILD_ID
      - PISTO_REGION=${_REGION}
      - PISTO_SERVICE=${_SERVICE}
      - PISTO_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}
      - PISTO_MIGRATION_JOB=${_MIGRATION_JOB}
      - PISTO_MIGRATION_SERVICE_ACCOUNT=${_MIGRATION_SERVICE_ACCOUNT}
      - PISTO_IMAGE_TAG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:build-$BUILD_ID
      - PISTO_API_URL=${_API_URL}
      - PISTO_APP_URL=${_APP_URL}
      - PISTO_APP_SCHEME=${_APP_SCHEME}
      - PISTO_DATABASE_SECRET_VERSION=${_DATABASE_SECRET_VERSION}
      - PISTO_MIGRATION_SECRET_VERSION=${_MIGRATION_SECRET_VERSION}
      - PISTO_AUTH_SECRET_VERSION=${_AUTH_SECRET_VERSION}
      - PISTO_PRODUCT_WRITES_ENABLED=${_PRODUCT_WRITES_ENABLED}
      - PISTO_PRODUCT_READ_LIMIT_PER_MINUTE=${_PRODUCT_READ_LIMIT_PER_MINUTE}
      - PISTO_PRODUCT_WRITE_LIMIT_PER_MINUTE=${_PRODUCT_WRITE_LIMIT_PER_MINUTE}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:build-$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
